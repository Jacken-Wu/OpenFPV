[preset.0]

name="Windows Debug"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="openfpv_debug"
export_filter="all_resources"
include_filter="content/base/map_locations.json,legal/*.txt"
exclude_filter="tests/*"
export_path="../builds/Debug/OpenFPV.exe"
script_export_mode=2

[preset.0.options]

custom_template/debug="../.local/export-templates/4.7.2.stable/openfpv_windows_debug_x86_64.exe"
custom_template/release="../.local/export-templates/4.7.2.stable/openfpv_windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=1
codesign/enable=false
application/modify_resources=false
application/icon="res://assets/openfpv.ico"

