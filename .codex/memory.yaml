    date: "2026-10-23"
    desc: "正常窗口自动化中，单次Input.parse_input_event的合成按住状态可能在窗口失焦时丢失；持续交互验证使用稳定输入驱动，焦点行为单独测。"
    evidence: "包内integration偶发只完成4/5校准。诊断连续99/113个50ms采样held=false、window.has_focus=false，近点ID正确/速度0、integration_mode让主场景input_focused仍true。换为VirtualInput模拟USB按钮、生产action_held共享路径并等待真实完成，包内integration连续三次9项通过；未放宽任务计时/范围/奖励。"
    freshness: "durable"
    death_condition: "替换自动化输入驱动或升级引擎后，原窗口场景不再复现合成键丢失时删除。"
