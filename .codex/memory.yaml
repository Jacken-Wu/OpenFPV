pitfalls:
  - id: "godot472-packed-biome-palette"
    date: "2026-10-21"
    desc: "本项目 4.7.2 打包暂禁用文本 Resource 转二进制；源工程通过不能代替资源包验证。"
    evidence: "tools/Build.ps1 在 convert_text_resources_to_binary=true 时，包内 WorldProvider._city/_canyon 报 Out of bounds get index 0/1 (PackedColorArray)；源 .tres 和 ResourceSaver roundtrip 均 palette=3。设为 false 后便携包正常，源与包 fingerprint 相同。"
    freshness: "durable"
    death_condition: "升级引擎或修复转换路径并通过源工程、包内色板及指纹一致性检查后删除。"
