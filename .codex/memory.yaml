pitfalls:
  - id: "fpv-camera-outside-collision-envelope"
    date: "2026-10-23"
    desc: "高速撞地需同时检查机体和第一人称相机/近裁剪面；相机挂点超出碰撞盒时，机体未穿地也会看到地下。"
    evidence: "camera-contact-before.log：120m/s、pitch=-1.4rad，explorer5机体最低0.16433m而camera=-0.00370m；light35机体0.11481m而camera=-0.05638m。原相机(0,.055,-.18)超出小机型盒范围。包围盒纳入7cm相机净空且保持底面/质心后，两机型camera最低0.05398m；handling新增两机型120/300m/s共4项相机及近裁剪面四角通过。"
    freshness: "durable"
    death_condition: "相机挂点、视锥与机体碰撞包围由统一结构数据生成且相关实物理测试持续覆盖后可替换。"
  - id: "native-ccd-fast-tilted-triangle-miss"
    date: "2026-10-23"
    desc: "Godot4.7.2当前默认后端原生CCD和单次凸形cast都可能漏极端高速倾斜三角面碰撞，额外角点射线兜底必须沿真实几何，不用世界高度钳制。"
    evidence: "collision-probe.log与仅cast的collision-after旧记录：80例中2例穿透，姿态(.8,.4,-.7)、速度(0,-1200,0)、起始2.3/3.7m，结束Y=-2.1379/-3.5339m。加入中心/八角点射线后同80例零穿透，handling105同时验证斜坡、负坐标生产地形和16m竖井开放。"
    freshness: "durable"
    death_condition: "升级引擎/物理后端后原80例与相机/斜坡/生产地形/竖井实物理回归足以证明原生CCD稳定时重新评估。"
  - id: "city-shaft-terrain-vertical-owner"
    date: "2026-10-23"
    desc: "城市入口将整块地板替换为地形时，必须向地形计算出的垂直owner层生成；不能只在原地板的y=-1层调用地形提供者。"
    evidence: "种子271828，入口(-1856,0.2,-2096)，群系base.biome.oldtown:s4:-3:-3。隔离脚本复现ENTRANCE_REPRO old_lower_query_meshes=0 actual_upper_query_meshes=1；入口整平后minimum>=0导致地形owner=0，旧逻辑仅-1替换使64m地面消失。修复两层协调后entrance_tests三种子43项和窗口44项，真实竖井畅通、四边与外围地面射线均通过。日志.local/test-results/entrance-repro.log。"
    freshness: "durable"
    death_condition: "城市与自然地形统一按三维owner输出且入口覆盖和碰撞回归持续验证后可替换。"
