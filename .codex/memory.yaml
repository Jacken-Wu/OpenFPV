    evidence: "完整Test.ps1 -Window在tuning组出现7个保存/重启恢复失败：直接设置三个轴和环境SpinBox.value后同帧submit，遍历所有SpinBox.apply把旧显示文字写回。改为仅field.get_line_edit().has_focus时apply，tuning36项恢复通过，playability真实遥控器再次交互提交文本仍通过。"
    freshness: "durable"
    death_condition: "数字编辑与Range值采用统一即时提交机制并覆盖文本/滑杆/同帧修改后删除。"
